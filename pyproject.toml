[project]
name = "btc-cycle-planner"
description = "Analizza documenti sul ciclo di Bitcoin e genera un piano di investimento."
requires-python = ">=3.9"
dynamic = ["version"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
"src/btc_cycle/i18n*.py" = ["E501"]  # tabelle di traduzioni
"src/btc_cycle/guide_*.py" = ["E501"]  # testo della guida

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]
